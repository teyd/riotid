[tools]
node = "26.13.1"
pnpm = "12.21.0"
worktrunk = "0.82.0"

[env]
_.file = ".env.worktree"

[tasks.install]
run = "pnpm install"

[tasks.dev]
run = "pnpm exec varlock run -- node apps/cli/src/main.ts db:migrate && pnpm exec varlock run -- node apps/cli/src/main.ts db:seed && pnpm exec varlock run -- pnpm exec vp run -r --parallel dev"

[tasks.check]
run = "pnpm exec effect-tsgo vp check && pnpm exec effect-tsgo tsc -p tsconfig.json"

[tasks.lint]
run = "pnpm exec effect-tsgo vp lint"

[tasks.fmt]
run = "pnpm exec vp fmt"

[tasks.test]
run = "pnpm exec vp run -r test"

[tasks.build]
run = "pnpm exec vp build apps/web"

[tasks.serve]
run = "pnpm exec varlock run -- node apps/cli/src/main.ts db:migrate && pnpm exec varlock run -- node apps/api/src/index.ts"

[tasks.scheduler]
run = "pnpm exec varlock run -- node apps/scheduler/src/main.ts"

[tasks.cli]
run = "pnpm exec varlock run -- node apps/cli/src/main.ts"

[tasks."auth:login"]
run = "pnpm exec varlock run -- node apps/cli/src/main.ts auth:login"

[tasks."auth:save"]
run = "pnpm exec varlock run -- node apps/cli/src/main.ts auth:save"

[tasks."auth:check"]
run = "pnpm exec varlock run -- node apps/cli/src/main.ts auth:check"

[tasks."auth:refresh"]
run = "pnpm exec varlock run -- node apps/cli/src/main.ts auth:refresh"

[tasks.probe]
run = "pnpm exec varlock run -- node apps/cli/src/main.ts probe"

[tasks."db:migrate"]
run = "pnpm exec varlock run -- node apps/cli/src/main.ts db:migrate"

[tasks."db:generate"]
run = "pnpm --dir packages/db exec drizzle-kit generate"

[tasks.perf]
run = "node apps/web/perf-check.mjs"

[tasks."perf:web"]
run = '''
export STROBE_BROWSER="${STROBE_BROWSER:-$PWD/tools/strobe-browser.sh}"
pnpm exec strobe bench perf/app.bench.ts --head . --check --headless
'''

[tasks."perf:compare"]
run = '''
export STROBE_BROWSER="${STROBE_BROWSER:-$PWD/tools/strobe-browser.sh}"
pnpm exec strobe bench perf/app.bench.ts --base main --head . --headless
'''

[tasks.scan]
run = "pnpm exec varlock run -- node apps/cli/src/main.ts scan"

[tasks.stats]
run = "pnpm exec varlock run -- node apps/cli/src/main.ts stats"

[tasks.backup]
run = "pnpm exec varlock run -- node apps/cli/src/main.ts backup"

[tasks."backup:restore"]
run = "pnpm exec varlock run -- node apps/cli/src/main.ts backup:restore"

[tasks."db:prune"]
run = "pnpm exec varlock run -- node apps/cli/src/main.ts db:prune"

[tasks."anon:list"]
run = "pnpm exec varlock run -- node apps/cli/src/main.ts anon:list"

[tasks."anon:resolve"]
run = "pnpm exec varlock run -- node apps/cli/src/main.ts anon:resolve"

[tasks."anon:cache"]
run = "pnpm exec varlock run -- node apps/cli/src/main.ts anon:cache"

[tasks."index:rebuild"]
run = "pnpm exec varlock run -- node apps/cli/src/main.ts index:rebuild"

[tasks."player:show"]
run = "pnpm exec varlock run -- node apps/cli/src/main.ts player:show"

[tasks."player:remove"]
run = "pnpm exec varlock run -- node apps/cli/src/main.ts player:remove"

[tasks."db:seed"]
run = "pnpm exec varlock run -- node apps/cli/src/main.ts db:seed"

[tasks."db:seed:scale"]
run = "pnpm exec varlock run -- node apps/cli/src/main.ts db:seed:scale"

[tasks."db:check"]
run = "pnpm exec varlock run -- node apps/cli/src/main.ts db:check"

[tasks."db:recover"]
run = "pnpm exec varlock run -- node apps/cli/src/main.ts db:recover"

[tasks."db:verify"]
run = "pnpm --dir packages/db exec drizzle-kit check"

[tasks.ci]
run = "mise run check && mise run test && mise run build && mise run db:verify"

[tools]
node = "26.13.1"
pnpm = "12.21.0"
worktrunk = "0.82.0"

[env]
_.file = ".env.worktree"

[tasks.install]
run = "pnpm install"

[tasks.dev]
run = "pnpm exec varlock run -- pnpm exec vp run -r --parallel dev"

[tasks.check]
run = "pnpm exec effect-tsgo vp check && pnpm exec effect-tsgo tsc -p tsconfig.json"

[tasks.lint]
run = "pnpm exec effect-tsgo vp lint"

[tasks.fmt]
run = "pnpm exec vp fmt"

[tasks.test]
run = "pnpm exec vp run -r test"

[tasks.build]
run = "pnpm exec vp build apps/web"

[tasks.serve]
run = "pnpm exec varlock run -- node apps/api/src/cli.ts serve"

[tasks."auth:login"]
run = "pnpm exec varlock run -- node apps/api/src/cli.ts auth:login"

[tasks."auth:save"]
run = "pnpm exec varlock run -- node apps/api/src/cli.ts auth:save"

[tasks."auth:check"]
run = "pnpm exec varlock run -- node apps/api/src/cli.ts auth:check"

[tasks."auth:refresh"]
run = "pnpm exec varlock run -- node apps/api/src/cli.ts auth:refresh"

[tasks.probe]
run = "pnpm exec varlock run -- node apps/api/src/cli.ts probe"

[tasks."db:migrate"]
run = "pnpm exec varlock run -- node apps/api/src/cli.ts db:migrate"

[tasks."db:generate"]
run = "pnpm --dir packages/db exec drizzle-kit generate"

[tasks.deploy]
run = '''
set -euo pipefail
KEY_FILE="${DOKPLOY_API_KEY_FILE:-$HOME/.config/opencode/secrets/dokploy-api-key}"
APP_ID="${DOKPLOY_APP_ID:-rFY3Ndzbbr0OFd08G3wrc}"
DOKPLOY="${DOKPLOY_URL:-http://100.88.23.55:3000}"
curl -fsS -X POST \
  -H "x-api-key: $(tr -d '\r\n' < "$KEY_FILE")" \
  -H 'content-type: application/json' \
  -d "{\"applicationId\":\"$APP_ID\"}" \
  "$DOKPLOY/api/application.deploy" >/dev/null
echo 'Deployment queued'
'''

[tasks.perf]
run = "node apps/web/perf-check.mjs"

[tasks.scan]
run = "pnpm exec varlock run -- node apps/api/src/cli.ts scan"

[tasks.stats]
run = "pnpm exec varlock run -- node apps/api/src/cli.ts stats"

[tasks.backup]
run = "pnpm exec varlock run -- node apps/api/src/cli.ts backup"

[tasks."backup:restore"]
run = "pnpm exec varlock run -- node apps/api/src/cli.ts backup:restore"

[tasks."db:prune"]
run = "pnpm exec varlock run -- node apps/api/src/cli.ts db:prune"

[tasks."anon:list"]
run = "pnpm exec varlock run -- node apps/api/src/cli.ts anon:list"

[tasks."anon:resolve"]
run = "pnpm exec varlock run -- node apps/api/src/cli.ts anon:resolve"

[tasks."anon:cache"]
run = "pnpm exec varlock run -- node apps/api/src/cli.ts anon:cache"

[tasks."index:rebuild"]
run = "pnpm exec varlock run -- node apps/api/src/cli.ts index:rebuild"

[tasks."player:show"]
run = "pnpm exec varlock run -- node apps/api/src/cli.ts player:show"

[tasks."player:remove"]
run = "pnpm exec varlock run -- node apps/api/src/cli.ts player:remove"

[tasks."db:seed"]
run = "pnpm exec varlock run -- node apps/api/src/cli.ts db:seed"

[tasks."db:check"]
run = "pnpm exec varlock run -- node apps/api/src/cli.ts db:check"

[tasks."db:verify"]
run = "pnpm --dir packages/db exec drizzle-kit check"

[tasks.ci]
run = "mise run check && mise run test && mise run build"

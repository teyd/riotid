services:
  riotid:
    build: .
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      PUBLIC_ORIGIN: https://riotid.teyd.dev
      DATABASE_PATH: /app/data/riotid.db
      COOKIE_FILE: /app/data/cookies.json
      BACKUP_DIRECTORY: /app/data/backups
    volumes:
      - riotid-data:/app/data
    ports:
      - '3000:3000'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/healthz').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

volumes:
  riotid-data:

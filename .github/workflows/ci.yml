name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: voidzero-dev/setup-vp@v1.22.0
        with:
          node-version-file: .node-version
          cache: true
          cache-toolchain: true
          cache-save: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - run: pnpm exec effect-tsgo vp check
      - run: pnpm exec effect-tsgo tsc -p tsconfig.json
      - run: pnpm exec vp build apps/web
      - run: pnpm --dir packages/db exec drizzle-kit check

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: voidzero-dev/setup-vp@v1.22.0
        with:
          node-version-file: .node-version
          cache: true
          cache-toolchain: true
          cache-save: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - run: pnpm exec vp run -r test

  # Strobe is a post-merge check; timed A/B stays local.
  strobe:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: voidzero-dev/setup-vp@v1.22.0
        with:
          node-version-file: .node-version
          cache: true
          cache-toolchain: true
          cache-save: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - uses: anomalyco/strobe@v0.44.0
        with:
          bench: perf/app.bench.ts
          version: project
          upload-artifacts: never

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: riotid:ci
          provenance: false
          cache-from: type=gha
          cache-to: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'type=gha,mode=max' || '' }}

name: CI

on:
  push:
    branches: [main, feat/riotid]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: voidzero-dev/setup-vp@v1.22.0
        with:
          cache: true
      - run: pnpm exec effect-tsgo vp check && pnpm exec effect-tsgo tsc -p tsconfig.json
      - run: pnpm exec vp run -r test
      - run: pnpm exec vp build apps/web
      - run: pnpm --dir packages/db exec drizzle-kit check
      - run: docker build -t riotid:ci .
